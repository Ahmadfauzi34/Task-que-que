name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Termux installer syntax
        run: |
          sh -n install-termux.sh
          sh -n gateway/install-bun-termux.sh
          sh -n gateway/tests/termux-smoke.sh
          sh -n gateway/tests/trycloudflare-smoke.sh
          sh -n tests/termux-shutdown-smoke.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --all-targets --verbose

  gateway:
    name: Bun Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Show Bun version
        run: bun --version

      - name: Run gateway tests
        working-directory: gateway
        run: bun test

      - name: Compile gateway entrypoint
        working-directory: gateway
        run: bun build src/server.ts --target=bun --outdir=.check-dist

  gateway-integration:
    name: Bun to Rust Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Build Rust queue daemon
        run: cargo build --locked --bin robust-sinkhorn-queue

      - name: Run localhost protocol smoke test
        run: bash gateway/tests/e2e.sh
