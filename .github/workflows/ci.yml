name: CI

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  normalize-worker-sources:
    if: github.event.pull_request.number == 21 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 20

      - name: Install canonical rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply compiler-confirmed fixes and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/use rusqlite::{params, OptionalExtension, TransactionBehavior};/use rusqlite::{params, TransactionBehavior};/' src/worker_protocol.rs
          sed -i 's/task\.name\.as_str()/task.task_name.as_str()/g; s/task\.kind\.to_db()/task.task_kind.to_db()/g' src/worker_api.rs
          cargo fmt --all

      - name: Restore normal CI definition
        shell: bash
        run: |
          set -euo pipefail
          git checkout 9f8daa95684201aed7619faebae0d3b4c8711e29 -- .github/workflows/ci.yml

      - name: Commit normalized sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml src/worker_protocol.rs src/worker_api.rs src/bin/robust-sinkhorn-worker.rs
          git commit -m 'style: normalize worker sources and fix claim fields'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
