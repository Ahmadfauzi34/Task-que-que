name: CI

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  apply-worker-clippy-fix:
    if: github.event.pull_request.number == 21 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install canonical rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply lint-equivalent clamp
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/(now - task\.created_at)\.max(0\.0)\.min(300\.0)/(now - task.created_at).clamp(0.0, 300.0)/' src/worker_protocol.rs
          cargo fmt --all
          git diff --check -- src/worker_protocol.rs

      - name: Commit worker source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker_protocol.rs
          git commit -m 'style: use canonical clamp in worker dispatch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
