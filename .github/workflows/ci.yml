name: CI

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  harden-public-projection:
    if: github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove worker internals from public projection
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e '/    "locked_by",/d' \
            -e '/    "locked_until",/d' \
            -e '/    "heartbeat_at",/d' \
            -e '/    "error_log",/d' \
            -e '/    "lease_generation",/d' \
            gateway/src/app.ts
          git diff --check -- gateway/src/app.ts

      - name: Commit source-only projection hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gateway/src/app.ts; then
            echo "projection already hardened"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gateway/src/app.ts
          git commit -m 'gateway: hide worker internals from public snapshots'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
