name: Reference Machine Lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Start Restart Recover
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun reference runtime
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Validate lifecycle shell syntax
        run: |
          sh -n ops/termux-reference-machine.sh
          bash -n tests/reference-machine-lifecycle-smoke.sh

      - name: Build queue and worker broker
        run: cargo build --locked --bin robust-sinkhorn-queue --bin robust-sinkhorn-worker

      - name: Prove reference lifecycle and restart recovery
        run: timeout 90s bash tests/reference-machine-lifecycle-smoke.sh
